name: Daily Real-Time Loan Simulation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      cold_start:
        description: 'First-ever run: seed from committed Snowflake export instead of resuming from Azure state'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      target_date:
        description: 'Override the simulated date (YYYY-MM-DD) -- leave blank to use real today'
        required: false
        default: ''

jobs:
  simulate-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy pyyaml azure-storage-blob requests snowflake-connector-python dbt-core dbt-snowflake

      - name: Determine today's simulation date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "run_date=${{ github.event.inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily simulation
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          cd data/synthetic/realtime
          if [ "${{ github.event.inputs.cold_start }}" == "true" ]; then
            python3 run_daily.py \
              --state-dir /tmp/state \
              --landing-dir /tmp/landing \
              --target-date "${{ steps.date.outputs.run_date }}" \
              --seed-state-path seed_state_seed.csv \
              --seed-roster-path collector_roster_seed.csv \
              --use-azure
          else
            python3 run_daily.py \
              --state-dir /tmp/state \
              --landing-dir /tmp/landing \
              --target-date "${{ steps.date.outputs.run_date }}" \
              --use-azure
          fi

      - name: Trigger downstream ingestion (Databricks -> Snowflake -> dbt)
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          cd data/synthetic/realtime
          python3 trigger_downstream.py "${{ steps.date.outputs.run_date }}"