name: Daily Real-Time Loan Simulation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      cold_start:
        description: 'First-ever run: seed from committed Snowflake export instead of resuming from git state'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      target_date:
        description: 'Override the simulated date (YYYY-MM-DD) -- leave blank to use real today'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  simulate-and-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy pyyaml snowflake-connector-python cryptography dbt-core dbt-snowflake matplotlib

      - name: Determine today's simulation date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            echo "run_date=${{ github.event.inputs.target_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily simulation
        run: |
          cd data/synthetic/realtime
          if [ "${{ github.event.inputs.cold_start }}" == "true" ]; then
            python3 run_daily.py \
              --state-dir live_state \
              --landing-dir /tmp/landing \
              --target-date "${{ steps.date.outputs.run_date }}" \
              --seed-state-path seed_state_seed.csv \
              --seed-roster-path collector_roster_seed.csv
          else
            python3 run_daily.py \
              --state-dir live_state \
              --landing-dir /tmp/landing \
              --target-date "${{ steps.date.outputs.run_date }}"
          fi

      - name: Commit updated state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/synthetic/realtime/live_state
          git commit -m "Update simulation state -- ${{ steps.date.outputs.run_date }}" || echo "No state changes to commit"
          git push

      - name: Write Snowflake private key
        env:
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          echo "$SNOWFLAKE_PRIVATE_KEY_B64" | base64 -d > /tmp/snowflake_key.p8
          chmod 600 /tmp/snowflake_key.p8

      - name: Trigger downstream ingestion (Snowflake -> dbt)
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
        run: |
          cd data/synthetic/realtime
          python3 trigger_downstream.py "${{ steps.date.outputs.run_date }}" /tmp/landing

      - name: Send daily KPI report email
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_key.p8
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          cd data/synthetic/realtime
          python3 send_daily_report.py "${{ steps.date.outputs.run_date }}"